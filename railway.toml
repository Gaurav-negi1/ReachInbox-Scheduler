[build]
builder = "NIXPACKS"
# NODE_ENV=production makes npm skip devDependencies, which the TypeScript
# build needs. Migrations CANNOT run here: Railway builders have no access to
# the environment's private network (postgres.railway.internal is unreachable
# from builds — P1001), so prisma:deploy runs in the start command instead.
buildCommand = "npm install --include=dev && npm run build --workspaces"

[deploy]
startCommand = "npm run prisma:deploy --workspace backend && npm run start --workspace backend"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
